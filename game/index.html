<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solara Heat — an open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0e14;
    min-height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px 10px;
    box-sizing: border-box;
    font-family: system-ui, sans-serif;
    color: #8b95a5;
  }
  canvas {
    width: min(1280px, 98vw);
    height: auto;
    aspect-ratio: 1280 / 800;
    background: #1d4e5e;
    border-radius: 10px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);
  }
  p {
    margin: 0;
    font-size: 13px;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<p>SOLARA HEAT — WASD / arrows to move &amp; drive · E to steal a car · SPACE handbrake · M sound</p>
<script type="module" src="src/main.js"></script>
</body>
</html>
